[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textbook-agent"
version = "0.1.0"
description = "AI-powered textbook writing agent using DeepSeek and LangGraph"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek>=0.1.0"]
dev      = ["ruff>=0.4.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
export   = ["playwright>=1.40"]

[project.scripts]
textbook-agent = "textbook_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/textbook_agent"]
# Include Jinja2 templates and default config bundled inside the package
artifacts = [
    "src/textbook_agent/prompts/*.j2",
    "src/textbook_agent/configs/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
