# Default configuration for textbook-agent
# Override via environment variables (prefix: TEXTBOOK_) or .env file.

model: "deepseek-chat"
base_url: "https://api.deepseek.com"

# Legacy flat temperatures — still honoured by Settings for .env compat
temperature:
  planning: 0.3
  writing: 0.5
  reviewing: 0.2

max_retries: 3
section_review: true
auto_revise: true
output_dir: "output"
streaming: true
verbose: false

# Proxy settings (disabled by default)
# proxy: "http://127.0.0.1:7890"
# no_proxy: false

# ── Per-step LLM configuration ────────────────────────────────────────────────
# CLI flags (--model / --effort / --temperature) override these at runtime.
# Priority: CLI flag > step config > default config.
llm:
  default:
    model: "deepseek-chat"
    reasoning_effort: "high"
    temperature: 0.4

  steps:
    intake_questions:
      reasoning_effort: "high"
      temperature: 0.3

    brief:
      reasoning_effort: "high"
      temperature: 0.3

    plan:
      reasoning_effort: "max"
      temperature: 0.3

    toc:
      reasoning_effort: "max"
      temperature: 0.3

    style:
      reasoning_effort: "high"
      temperature: 0.3

    outline:
      reasoning_effort: "high"
      temperature: 0.4

    write:
      reasoning_effort: "high"
      temperature: 0.5

    review:
      reasoning_effort: "none"
      temperature: 0.2

    revise:
      reasoning_effort: "none"
      temperature: 0.4

    memory:
      reasoning_effort: "none"
      temperature: 0.2

    assemble:
      reasoning_effort: "high"
      temperature: 0.2
